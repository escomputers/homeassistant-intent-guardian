[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intentguard"
version = "0.1.0"
description = "Walking skeleton for the IntentGuard architecture."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "IntentGuard contributors" },
]
dependencies = [
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
addon = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "websockets>=12,<16",
]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
]

[tool.setuptools.packages.find]
include = ["addon*", "intentguard_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
